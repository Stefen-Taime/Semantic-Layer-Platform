services:
  druid:
    build:
      context: ..
      dockerfile: docker/druid/Dockerfile
    image: metricforge-druid:36.0.0
    env_file:
      - ./druid/environment
    ports:
      - "8888:8888"
      - "8082:8082"
    volumes:
      - druid_data:/opt/druid/var
      - ./druid:/opt/metricforge/docker-druid:ro
      - ../druid/ingestion_specs:/opt/metricforge/druid/ingestion_specs:ro
      - ../druid/sample_queries:/opt/metricforge/druid/sample_queries:ro
    entrypoint:
      - /bin/bash
      - -lc
    command: >
      echo 'Starting Apache Druid single-server quickstart for MetricForge NYC' &&
      echo 'If this image changes, adjust command and config paths as documented in docker/README.md' &&
      bin/start-druid single-server "${DRUID_SINGLE_NODE_CONF:-nano-quickstart}"
    networks:
      - metricforge_net
