services:
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - metricforge_net

  airflow-init:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - ./airflow/airflow.env
    depends_on:
      airflow-postgres:
        condition: service_started
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/include:/opt/airflow/include
      - ../airflow/plugins:/opt/airflow/plugins
      - ../semantic_layer:/opt/airflow/semantic_layer
      - ../spark:/opt/airflow/spark
      - ../druid:/opt/airflow/druid
      - ../scripts:/opt/airflow/scripts
      - app_logs:/opt/airflow/logs
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Metric
      --lastname Forge
      --role Admin
      --email admin@example.com
      "
    networks:
      - metricforge_net
    restart: "no"

  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - ./airflow/airflow.env
    depends_on:
      airflow-postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/include:/opt/airflow/include
      - ../airflow/plugins:/opt/airflow/plugins
      - ../semantic_layer:/opt/airflow/semantic_layer
      - ../spark:/opt/airflow/spark
      - ../druid:/opt/airflow/druid
      - ../scripts:/opt/airflow/scripts
      - app_logs:/opt/airflow/logs
    command: webserver
    networks:
      - metricforge_net

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/airflow/Dockerfile
    env_file:
      - ./airflow/airflow.env
    depends_on:
      airflow-postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/include:/opt/airflow/include
      - ../airflow/plugins:/opt/airflow/plugins
      - ../semantic_layer:/opt/airflow/semantic_layer
      - ../spark:/opt/airflow/spark
      - ../druid:/opt/airflow/druid
      - ../scripts:/opt/airflow/scripts
      - app_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - metricforge_net
